<section class="player-column">
  <div class="meta-workspace-card">
    <h2>{{studioTitle}}</h2>
  </div>
  <div class="video-player-mock">
    <!-- Embedded responsive Vimeo player tracking the active store selection -->
    <template x-if="active.source">
      <iframe
        :src="`https://player.vimeo.com/video/${active.source}?autoplay=0&title=0&byline=0&portrait=0`"
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: 0;
        "
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
      ></iframe>
    </template>

    <!-- Fallback state if no video source token identifier is provided -->
    <template x-if="!active.source">
      <div
        style="
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-size: cover;
          background-position: center;
        "
        :style="active.heroImage ? `background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), url(${active.heroImage})` : ''"
      >
        <div class="preview-badge">Preview Mock Window</div>
      </div>
    </template>
  </div>

  {{controls}}
</section>
