<a
  href="/artists/{{artistName}}/{{id}}"
  class="card"
  style="text-decoration: none; color: inherit"
>
  <div class="card-thumbnail" style="background-image: url('{{image}}')"></div>
  <div class="card-metadata">
    <h3 class="capitalize-words">{{venue}}</h3>
    <p class="date">{{date}}</p>
  </div>
</a>
