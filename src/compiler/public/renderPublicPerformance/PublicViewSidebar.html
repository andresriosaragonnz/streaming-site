<aside class="playlist-sidebar">
  <div id="sidebar-artist" class="sidebar-artist-container">
    <a
      class="sidebar-artist-button"
      id="sidebar-artist-button"
      :href="'/' + $store.player.active.artistName"
      x-text="$store.player.active.formattedArtist"
    ></a>
    <button
      type="button"
      class="sidebar-artist-button"
      x-on:click="$store.follows.toggleFollow()"
      x-text="$store.follows.isFollowing() ? 'Unfollow':'Follow'"
    ></button>
  </div>
  <div class="carousel-wrapper" x-data="carousel">
    <button
      type="button"
      class="carousel-nav-btn nav-left"
      x-show="canScrollLeft"
      @click="scroll('left')"
      x-transition
      x-cloak
    >
      ‹
    </button>

    <div
      class="sidebar-scroll-list"
      x-ref="scrollList"
      @scroll.debounce.50ms="checkScroll()"
    >
      <template
        x-for="(seg, idx) in $store.player.segments"
        :key="seg.id || idx"
      >
        {{cards}}
      </template>
    </div>

    <button
      type="button"
      class="carousel-nav-btn nav-right"
      x-show="canScrollRight"
      @click="scroll('right')"
      x-transition
      x-cloak
    >
      ›
    </button>
  </div>
</aside>
