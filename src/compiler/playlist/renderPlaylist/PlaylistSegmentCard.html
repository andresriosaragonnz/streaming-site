<div
  class="sidebar-item-card"
  :class="{ 'is-being-dragged': draggedIndex === {{index}} }"
  draggable="true"
  @dragstart="handleDragStart({{index}}, $event)"
  @dragover="handleDragOver($event)"
  @drop="handleDrop({{index}}, $event)"
  @dragend="handleDragEnd()"
>
  <div
    @click="$store.player.selectSegment({{index}})"
    class="sidebar-item-card"
  >
    <div class="item-meta">{{> components/common/SegmentCardImage.html}}</div>
    <div class="title-text">
      <span>{{title}}</span>
    </div>
    <div class="title-text">
      <span>{{formattedArtist}}</span>
    </div>
  </div>
</div>
