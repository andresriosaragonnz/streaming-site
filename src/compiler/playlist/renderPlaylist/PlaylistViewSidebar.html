<aside class="playlist-sidebar">
  <div id="sidebar-artist" class="sidebar-artist-container">
    <a
      class="sidebar-artist-button"
      id="sidebar-artist-button"
      href="/{{artistLink}}"
      :href="'/' + $store.player.segments[$store.player.currentIndex].artistName"
      x-text="$store.player.segments[$store.player.currentIndex].formattedArtist"
    >
      {{artistName}}
    </a>

    <button
      type="button"
      class="sidebar-artist-button"
      x-on:click="$store.follows.toggleFollow()"
      x-text="$store.follows.isFollowing() ? 'Unfollow':'Follow'"
    >
      Follow
    </button>
  </div>

  <div class="carousel-wrapper" id="sidebar-carousel" x-data="carousel">
    <button
      type="button"
      class="carousel-nav-btn nav-left"
      id="carousel-nav-left"
      style="display: none"
    >
      ‹
    </button>

    <!-- Delegated Click Listener Target -->
    <div class="sidebar-scroll-list" id="sidebar-scroll-list">{{cards}}</div>

    <button
      type="button"
      class="carousel-nav-btn nav-right"
      id="carousel-nav-right"
      style="display: none"
    >
      ›
    </button>
  </div>
</aside>
