<div class="artist-hero">
  <!-- 1. Responsive Picture Stack -->
  <picture class="hero-picture">
    <!-- Mobile Portrait (< 640px) -->
    <source
      id="hero-mobile-avif"
      type="image/avif"
      media="(max-width: 639px)"
      srcset="{{heroImage}}/mobile.avif"
    />
    <!-- Desktop Master (>= 1024px) -->
    <source
      id="hero-desktop-avif"
      type="image/avif"
      srcset="{{heroImage}}/desktop.avif"
    />

    <!-- Legacy Fallback JPG -->
    <img
      id="hero-img"
      src="{{heroImage}}/desktop.jpg"
      alt="{{title}}"
      class="hero-img"
      loading="eager"
    />
  </picture>

  <!-- Dedicated Hover Fade Overlay (Outside picture tag) -->
  <img id="hero-img-fade" src="" alt="" class="hero-img-fade" />

  <!-- 2. Independent Gradient Overlay for Readability -->
  <div class="hero-gradient-overlay"></div>

  <!-- 3. Foreground Content Overlay -->
  <div class="hero-overlay">
    <h1 class="capitalize-words">{{title}}</h1>
    <p class="performance-count">{{count}} Documented</p>
    <div id="performance-link" data-artist="{{link}}"></div>
  </div>
</div>
