<div
  @click="$store.player.selectSegment({{index}})"
  class="sidebar-item-card"
  :class="$store.player.currentIndex === {{index}} ? 'item-active-highlight' : ''"
>
  <div class="item-meta">
    {{> components/common/SegmentCardImage.html}}

    <div class="status-text">
      <span
        x-text="$store.player.segments[{{index}}]?.status === 'public' ? 'Public' : 'Private'"
      >
        {{status}}
      </span>
      <span>{{formatedDuration}}</span>
    </div>
  </div>

  <div class="title-text">
    <span x-text="$store.player.segments[{{index}}]?.title">{{title}}</span>
  </div>
</div>
