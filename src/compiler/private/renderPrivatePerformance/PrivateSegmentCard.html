<div
  @click="$store.player.selectSegment(idx)"
  class="sidebar-item-card"
  :class="[
    $store.player.currentIndex === idx ? 'item-active-highlight' : ''
  ]"
>
  <div class="item-meta">
    {{> components/common/SegmentCardImage.html}}
    <div class="status-text">
      <span x-text="seg.status === 'public' ? 'Public' : 'Private'"></span>
      <span x-text="seg.formatedDuration"></span>
    </div>
  </div>

  <div class="title-text">
    <!-- FIXED: Linked to the dynamic, reactive title string -->
    <span x-text="seg.title"></span>
  </div>
</div>
