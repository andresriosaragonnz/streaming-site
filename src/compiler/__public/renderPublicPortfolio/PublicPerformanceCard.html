<a
  href="/{{link}}"
  class="card"
  data-bg="{{altImage}}"
  style="text-decoration: none; color: inherit"
  @pointerenter.once="if (!window.HTMLScriptElement.supports?.('speculationrules')) { const l = document.createElement('link'); l.rel = 'prefetch'; l.href = '/{{link}}'; document.head.appendChild(l); }"
  @touchstart.passive.once="if (!window.HTMLScriptElement.supports?.('speculationrules')) { const l = document.createElement('link'); l.rel = 'prefetch'; l.href = '/{{link}}'; document.head.appendChild(l); }"
>
  {{> components/common/CardImage.html}}

  <div class="card-metadata">
    <h3 class="capitalize-words h3">{{formattedVenueName}}</h3>
    <p class="date">{{formattedDate}}</p>
  </div>
</a>
