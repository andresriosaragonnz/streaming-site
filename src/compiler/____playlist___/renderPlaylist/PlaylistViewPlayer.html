<section class="player-column" x-data="publicWorkspace" id="publicPlayerColumn">
  <div class="meta-title-card">
    <div>{{> components/Menu.html}}</div>
    <div class="meta-title-card-right">
      <!-- Toggle Mode -->
      <div class="toggle" @click="$store.player.togleMode()">
        <input type="checkbox" :checked="!$store.player.mode" />
        <label></label>
      </div>
    </div>
  </div>

  <div class="performance-title-big">{{pageTitle}}</div>
  <div
    class="performance-title break-hyphens"
    x-text="$store.player.active?.formattedTitle || '{{firstTitle}}'"
  >
    {{firstTitle}}
  </div>

  <!-- Outer wrapper with locked 16:9 ratio -->
  <div
    class="video-player-mock"
    style="
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
    "
  >
    <!-- VIDEO VIEW: Native display: block on load. Alpine hides only if mode === false -->
    {{> components/common/VideoPlayer.html}}

    <!-- AUDIO VIEW: Cloaked natively so it NEVER renders on page boot -->
    {{> components/common/AudioPlayer.html}}
  </div>

  {{> public/renderPublicPerformance/PublicPlayerControls.html}}
</section>
