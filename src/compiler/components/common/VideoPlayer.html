<div
  x-show="active.source"
  x-data="{ isInitialized: false }"
  x-effect="
    // Reset overlay whenever active track index changes
    $store.player.currentIndex;
    isInitialized = false;
  "
  style="width: 100%; height: 100%; background: #000; position: relative"
>
  <video
    id="r2-stream-player"
    controls
    playsinline
    preload="none"
    :poster="active?.heroImage ? `${active.heroImage}_desktop.jpg` : '/images/video-placeholder.jpg'"
    style="width: 100%; height: 100%; object-fit: contain; display: block"
  ></video>

  <!-- Centered Play Overlay -->
  <div
    x-show="!isInitialized"
    @click.prevent.stop="
    isInitialized = true;
      $store.player.playCurrent();
    "
    style="
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.35);
      cursor: pointer;
      z-index: 10;
      touch-action: manipulation;
    "
  >
    <svg
      class="play-icon"
      viewBox="0 0 24 24"
      fill="white"
      style="
        width: clamp(80px, 10vw, 150px);
        height: clamp(80px, 10vw, 150px);
        filter: drop-shadow(0px 6px 20px rgba(0, 0, 0, 0.6));
        pointer-events: none;
      "
    >
      <path d="M8 5v14l11-7z" />
    </svg>
  </div>
</div>
