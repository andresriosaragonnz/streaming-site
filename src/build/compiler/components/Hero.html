<div class="artist-hero">
  <!-- 1. Responsive Picture Stack -->
  <picture class="hero-picture">
    <!-- Mobile Portrait (4:5) (< 640px) -->
    <source
      type="image/avif"
      media="(max-width: 639px)"
      srcset="{{image}}_mobile.avif"
    />
    <source
      type="image/webp"
      media="(max-width: 639px)"
      srcset="{{image}}_mobile.webp"
    />

    <source
      type="image/avif"
      media="(max-width: 1023px)"
      srcset="{{image}}_tablet.avif"
    />
    <source
      type="image/webp"
      media="(max-width: 1023px)"
      srcset="{{image}}_tablet.webp"
    />

    <!-- Desktop Master (16:9) (>= 1024px) -->
    <source type="image/avif" srcset="{{image}}_desktop.avif" />
    <source type="image/webp" srcset="{{image}}_desktop.webp" />

    <!-- Legacy Fallback JPG -->
    <img
      src="{{image}}_desktop.jpg"
      alt="{{title}}"
      class="hero-img"
      loading="eager"
    />
  </picture>

  <!-- 2. Independent Gradient Overlay for Readability -->
  <div class="hero-gradient-overlay"></div>

  <!-- 3. Foreground Content Overlay (Aligned to Bottom) -->

  <div class="hero-overlay">
    <a href="/" class="btn-back">← Back to Archive</a>
    <h1 class="capitalize-words">{{title}}</h1>
    <p class="performance-count">{{count}} Documented</p>
  </div>
</div>
