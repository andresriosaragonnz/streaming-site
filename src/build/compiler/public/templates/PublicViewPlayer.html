<section class="player-column">
  <div class="meta-workspace-card">
    <h2>{{studioTitle}}</h2>
    <div class="toggle" @click="$store.review.togleMode()">
      <input type="checkbox" />
      <label></label>
    </div>
  </div>

  <div
    :class="$store.review.mode ? 'video-player-mock' : 'audio-player-mock'"
    style="position: relative; overflow: hidden; border-radius: 12px"
  >
    <!-- VIDEO PLAYER MODE (Visible when mode is true) -->
    <div
      x-show="$store.review.mode && active.source"
      style="width: 100%; height: 100%; background: #000"
    >
      <video
        id="r2-stream-player"
        controls
        playsinline
        preload="metadata"
        style="width: 100%; height: 100%; object-fit: contain; display: block"
      ></video>
    </div>

    <!-- MP3 AUDIO PLAYER MODE (Visible when mode is false) -->
    <div
      x-show="!$store.review.mode && active.source"
      style="
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        background-color: #1a1a1a;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      "
      :style="active.playerImage ? `background-image: url(${active.playerImage})` : `background-image: url('/screenshots/card/card-fallback.jpg')`"
    >
      <!-- Audio Player Controls Pinned to the Bottom -->
      <div
        style="
          width: 100%;
          padding: 16px;
          background: rgba(0, 0, 0, 0.6);
          display: flex;
          justify-content: center;
          align-items: center;
          box-sizing: border-box;
        "
      >
        <audio
          id="r2-audio-player"
          controls
          preload="metadata"
          style="width: 100%; max-width: 500px"
        ></audio>
      </div>
    </div>

    <!-- Empty Fallback Workspace State -->
    <template x-if="!active.source">
      <div
        style="
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #111;
        "
      >
        <div class="preview-badge">No Stream Active</div>
      </div>
    </template>
  </div>

  {{controls}}
</section>
