      // 2. Aggregate Data into Events (Key = date_venue)
      const events = {};
      const artists = new Set();

      Object.values(rawData).forEach((item) => {
        if (!item.artist || !item.venue || !item.date) return;

        artists.add(item.artist);
        const eventKey = `${item.date}_${item.venue}`;

        if (!events[eventKey]) {
          events[eventKey] = {
            venue: item.venue,
            date: item.date,
            artists: new Set(),
          };
        }
        events[eventKey].artists.add(item.artist);
      });

      // 3. Construct Nodes (Unique Artists)
      const artistArray = Array.from(artists);
      const artistIdMap = new Map();

      const nodes = artistArray.map((artist, index) => {
        const id = index + 1;
        artistIdMap.set(artist, id);
        return {
          id: id,
          name: artist.replace(/_/g, " "),
        };
      });

      // 4. Construct Edges (Connected Artists who played at the same event)
      const edgePairs = new Map();

      Object.entries(events).forEach(([eventKey, eventData]) => {
        const eventArtists = Array.from(eventData.artists);

        // Generate pairs for all artists on the same show line-up
        for (let i = 0; i < eventArtists.length; i++) {
          for (let j = i + 1; j < eventArtists.length; j++) {
            const id1 = artistIdMap.get(eventArtists[i]);
            const id2 = artistIdMap.get(eventArtists[j]);
            const pairKey = id1 < id2 ? `${id1}-${id2}` : `${id2}-${id1}`;

            if (!edgePairs.has(pairKey)) {
              edgePairs.set(pairKey, {
                source: id1,
                target: id2,
                weight: 1,
                events: [`${eventData.venue} (${eventData.date})`],
              });
            } else {
              const edge = edgePairs.get(pairKey);
              edge.weight += 1;
              edge.events.push(`${eventData.venue} (${eventData.date})`);
            }
          }
        }
      });

      const edges = Array.from(edgePairs.values()).map((edge, index) => ({
        id: `e-${index}`,
        start: edge.source,
        end: edge.target,
        source: edge.source,
        target: edge.target,
        weight: edge.weight,
        events: edge.events,
      }));

      // 5. Initialize Memgraph Orb
      const container = document.getElementById("graph");
      const orb = new Orb.Orb(container);

      // 6. Apply Network Styling
      orb.data.setDefaultStyle({
        getNodeStyle(node) {
          return {
            size: 7,
            color: "#0072d2",
            label: node.data.name,
            fontSize: 3.5,
            fontColor: "#ffffff",
          };
        },
        getEdgeStyle(edge) {
          return {
            color: edge.data.weight > 1 ? "#3b82f6" : "#ffffff",
            width: Math.min(edge.data.weight * 0.6, 3),
            opacity: 0.5,
          };
        },
      });

      // 7. Physics Configuration and Rendering
      orb.data.setup({ nodes, edges });

      orb.view.setSettings({
        simulation: {
          isPhysicsEnabled: true,
          gravity: -1200,
          springLength: 90,
        },
      });

      orb.view.render(() => {
        orb.view.recenter();
      });

      // Interactive Click Inspector
      orb.events.on("node-click", (event) => {
        console.log("🎵 Selected Artist:", event.node.data.name);
      });
