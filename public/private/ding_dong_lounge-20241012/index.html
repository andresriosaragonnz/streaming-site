  class="artist-hero"

>

    <a href="/" class="btn-back">← Back to Archive</a>

  </div>
</div>

      
      <div style="max-width: 1200px; margin: 1.5rem auto 0 auto; padding: 0 1rem;">
        <div style="background: #131926; border-left: 4px solid #3b82f6; padding: 1rem; border-radius: 0 4px 4px 0;">
          <p style="margin: 0; font-size: 0.9rem; opacity: 0.9;">

        <div
  class="card private-segment-card"
  x-data="{ 
    title: 'segment_1', 
    status: 'public', 
    id: 'e2c388ad-cbef-4b47-b353-066a3ebcfef0',
    toggleStatus() {
      this.status = this.status === 'public' ? 'private' : 'public';
      // TODO: Hook up a fetch() request to your Bun backend route here later to update the database
      console.log(`Track ${this.id} updated to: ${this.status}`);
    }
  }"
  :class="status === 'private' ? 'status-private-dim' : ''"
  style="position: relative"
>
  <div class="card-thumbnail" style="background-image: url('/screenshots/card/decibel_force-ding_dong_lounge-20241012_card_1.jpg')"></div>

  <div
    class="card-metadata"
    style="display: flex; flex-direction: column; gap: 0.75rem"
  >
    <div
      class="input-group"
      style="display: flex; flex-direction: column; gap: 0.25rem"
    >
      <label
        style="
          font-size: 0.75rem;
          text-transform: uppercase;
          opacity: 0.6;
          font-weight: bold;
        "
        >Song Title</label
      >
      <input
        type="text"
        x-model="title"
        class="input-dark"
        style="
          width: 100%;
          padding: 0.5rem;
          border-radius: 4px;
          border: 1px solid #2a2f45;
          background: #0b0e14;
          color: #fff;
        "
      />
    </div>

    <button
      @click="toggleStatus()"
      type="button"
      class="btn-toggle"
      :class="status === 'public' ? 'btn-public' : 'btn-private'"
      style="
        width: 100%;
        padding: 0.5rem;
        border: none;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        text-transform: uppercase;
        font-size: 0.8rem;
        transition: background 0.2s;
      "
    >
      <span x-text="status === 'public' ? '🌐 Public' : '🔒 Private'"></span>
    </button>
  </div>
</div>
