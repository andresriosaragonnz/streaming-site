<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Playlists</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="menu-container"><div class="menu">
  <!-- Hidden State Controllers -->
  <input type="checkbox" id="drawer-toggle" />
  <input type="checkbox" id="search-toggle" />

  <!-- Action Bar (Menu + Search Triggers) -->
  <div class="menu-action-bar">
    <label for="drawer-toggle" class="drawer-trigger" aria-label="Open menu">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      Menu
    </label>

    <label for="search-toggle" class="search-trigger" aria-label="Open search">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </label>
  </div>

  <!-- Search Overlay & Autocomplete Container -->
  <label for="search-toggle" class="search-overlay" aria-hidden="true"></label>

  <div class="search-container">
    <div class="search-header">
      <input
        type="text"
        id="search-input"
        placeholder="Search"
        autocomplete="off"
      />
      <label for="search-toggle" class="search-close" aria-label="Close search"
        >&times;</label
      >
    </div>
    <ul id="autocomplete-results" class="autocomplete-list"></ul>
  </div>

  <!-- Drawer Overlay Backdrop -->
  <label for="drawer-toggle" class="drawer-overlay" aria-hidden="true"></label>

  <!-- Drawer Panel -->
  <aside class="drawer-panel">
    <div class="drawer-header">
      <h2>Studio Navigation</h2>
      <label for="drawer-toggle" class="drawer-close" aria-label="Close menu"
        >&times;</label
      >
    </div>

    <ul id="drawer-target" class="drawer-links">
      <li>
        <a href="/feed" class="drawer-link">My Feed</a>
      </li>
      <li>
        <a href="/myplaylists" class="drawer-link" id="my-playlists"
          >My playlists</a
        >
      </li>
      <li>
        <a href="/roadmap" class="drawer-link">Roadmap</a>
      </li>
      <li>
        <a href="/budget" class="drawer-link">Budget</a>
      </li>

      <!-- Private Bands Container (Populated via menu.js) -->
      <li
        id="private-bands-section"
        class="drawer-section"
        style="display: none"
      >
        <span class="drawer-section-title">private:</span>
        <ul id="private-bands-list" class="drawer-sublinks"></ul>
      </li>
    </ul>
  </aside>

  <script type="module" src="/js/menu.js"></script>
</div>
</div>
    <div
  class="artist-hero"
  x-data="{ 
    // Generates a random number between 1 and n (e.g., 5 total hero images)
    heroImage: `/images/playlist_${Math.floor(Math.random() * 5) + 1}` 
  }"
>
  <!-- 1. Responsive Picture Stack -->
  <picture class="hero-picture">
    <!-- Mobile Portrait (4:5) (< 640px) -->
    <source
      type="image/avif"
      media="(max-width: 639px)"
      :srcset="`${heroImage}_mobile.avif`"
    />
    <source
      type="image/webp"
      media="(max-width: 639px)"
      :srcset="`${heroImage}_mobile.webp`"
    />

    <!-- Tablet (max-width: 1023px) -->
    <source
      type="image/avif"
      media="(max-width: 1023px)"
      :srcset="`${heroImage}_tablet.avif`"
    />
    <source
      type="image/webp"
      media="(max-width: 1023px)"
      :srcset="`${heroImage}_tablet.webp`"
    />

    <!-- Desktop Master (16:9) (>= 1024px) -->
    <source type="image/avif" :srcset="`${heroImage}_desktop.avif`" />
    <source type="image/webp" :srcset="`${heroImage}_desktop.webp`" />

    <!-- Legacy Fallback JPG -->
    <img
      :src="`${heroImage}_desktop.jpg`"
      alt="My playlists"
      class="hero-img"
      loading="eager"
    />
  </picture>

  <!-- 2. Independent Gradient Overlay for Readability -->
  <div class="hero-gradient-overlay"></div>

  <!-- 3. Foreground Content Overlay (Aligned to Bottom) -->
  <div class="hero-overlay">
    <h1 class="capitalize-words">My Updates</h1>
    <p class="performance-count">
      <span x-text="Object.keys($store.follows.getFeed()).length">0</span>
      Playlists
    </p>
  </div>
</div>

    <main class="performance-grid" x-data>
      <template
        x-for="(story, idx) in $store.follows.getFeed()"
        :key="story.artistName"
      >
        <a
          :href="`/${story.artistName}`"
          class="card"
          style="text-decoration: none; color: inherit"
        >
          <picture class="item-thumbnail">
            <source :srcset="`${story.image}.avif`" type="image/avif" />
            <source :srcset="`${story.image}.webp`" type="image/webp" />
            <img
              :src="`${story.image}.jpg`"
              loading="lazy"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
              "
            />
          </picture>

          <div class="card-metadata">
            <h3 class="capitalize-words h3" x-text="story.artistName"></h3>
            <p
              class="amount"
              x-text="`${story.artistName} ${story.count} new`"
            ></p>
          </div>
        </a>
      </template>
    </main>
  </body>
  <script type="module" src="/js/publicApp.js"></script>
</html>
