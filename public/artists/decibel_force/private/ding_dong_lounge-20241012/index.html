<html lang="en">

    <meta charset="utf-8" />

  <body>
    <div class="studio-container" x-data="studioWorkspace">
  <section class="player-column">
  <div class="meta-workspace-card">
    <h2>ding dong lounge - 12 Oct 24</h2>
  </div>

  <div class="video-player-mock">
    <!-- Clean HTML5 Native Architecture targeting your R2 Bucket objects directly -->
    <div
      x-show="active.source"
      style="width: 100%; height: 100%; background: #000"
    >
      <video
        id="r2-stream-player"
        controls
        playsinline
        preload="metadata"
        :poster="active.heroImage"
        style="width: 100%; height: 100%; object-fit: contain; display: block"
      ></video>
    </div>

    <!-- Empty Fallback Workspace State -->
    <template x-if="!active.source">
      <div
        style="
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-size: cover;
          background-position: center;
        "
        :style="active.heroImage ? `background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), url(${active.heroImage})` : ''"
      >
        <div class="preview-badge">No Stream Active</div>
      </div>
    </template>
  </div>

  <div class="meta-workspace-card">
  <div class="header-row">
    <div class="studio-controls-group">
      <div class="input-field-group">
        <input
          type="text"
          x-model="active.title"
          @input="$store.review.syncStore($store.review.currentIndex, active.title)"
        />
      </div>

      <button
        @click="$store.review.toggleStatus($store.review.currentIndex)"
        type="button"
        :class="active.status === 'public' ? 'btn-public' : 'btn-private'"
      >
        <span x-text="active.status === 'public' ? 'Public' : 'Private'"></span>
      </button>
    </div>
  </div>
</div>

</section>

<aside class="playlist-sidebar">
  <div
    class="carousel-wrapper"
    x-data="{ 
      canScrollLeft: false, 
      canScrollRight: false,
      checkScroll() {
        const el = this.$refs.scrollList;
        if (!el) return;
        this.canScrollLeft = el.scrollLeft > 5;
        this.canScrollRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 5;
      },
      scroll(direction) {
        const el = this.$refs.scrollList;
        if (!el) return;
        const scrollAmount = 252;
        el.scrollBy({ 
          left: direction === 'left' ? -scrollAmount : scrollAmount, 
          behavior: 'smooth' 
        });
      }
    }"
    x-init="
      $nextTick(() => { checkScroll(); });
      window.addEventListener('resize', () => checkScroll());
      
      if (window.ResizeObserver) {
        const observer = new ResizeObserver(() => checkScroll());
        observer.observe($refs.scrollList);
      }
    "
  >
    <button
      type="button"
      class="carousel-nav-btn nav-left"
      x-show="canScrollLeft"
      @click="scroll('left')"
      x-transition
      x-cloak
    >
      ‹
    </button>

    <div
      class="sidebar-scroll-list"
      x-ref="scrollList"
      @scroll.debounce.50ms="checkScroll()"
    >
      <template
        x-for="(seg, idx) in $store.review.segments"
        :key="seg.id || idx"
      >
        <div
  @click="$store.review.currentIndex = idx"
  class="sidebar-item-card"
  :class="[
    $store.review.currentIndex === idx ? 'item-active-highlight' : '',
    seg.status === 'private' ? 'sidebar-item-card' : 'sidebar-item-card=private'
  ]"
>
  <div
    class="item-thumbnail"
    :style="`background-image: url('/screenshots/card/${id}.jpg')`"
  ></div>

  <div class="item-meta">
    <div class="title-text">
      <!-- FIXED: Linked to the dynamic, reactive title string -->
      <span x-text="seg.title"></span>
    </div>
    <div class="title-text">
      <span x-text="seg.status === 'public' ? 'Public' : 'Private'"
        >Private</span
      >
    </div>
  </div>
</div>
