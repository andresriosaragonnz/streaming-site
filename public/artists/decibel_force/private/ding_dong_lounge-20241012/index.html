    <div class="studio-container" x-data="studioWorkspace">
  <section class="player-column">
  <div class="meta-workspace-card">
    <h2>ding dong lounge - 12 Oct 24</h2>
  </div>

  <div class="video-player-mock">
    <!-- Temporary Vimeo Embed (Proof of Concept - Swapping to R2 later) -->
    <template x-if="active.source">
      <iframe
        :src="`https://player.vimeo.com/video/${active.source}?autoplay=0&preload=auto&title=0&byline=0&portrait=0`"
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: 0;
        "
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
      ></iframe>
    </template>

    <!-- Fallback layout when no track source token is active -->
    <template x-if="!active.source">
      <div
        style="
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-size: cover;
          background-position: center;
        "
        :style="active.heroImage ? `background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), url(${active.heroImage})` : ''"
      >
        <div class="preview-badge">Preview Mock Window</div>
      </div>
    </template>
  </div>

  <div class="meta-workspace-card">
  <div class="header-row">
    <div class="studio-controls-group">
      <div class="input-field-group">
        <input
          type="text"
          x-model="active.title"
          @input="$store.review.syncStore($store.review.currentIndex, active.title)"
        />
      </div>

      <button
        @click="$store.review.toggleStatus($store.review.currentIndex)"
        type="button"
        :class="active.status === 'public' ? 'btn-public' : 'btn-private'"
      >
        <span x-text="active.status === 'public' ? 'Public' : 'Private'"></span>
      </button>
    </div>
  </div>
</div>

</section>

<aside class="playlist-sidebar">
  <div
    class="carousel-wrapper"
    x-data="{ 
      canScrollLeft: false, 
      canScrollRight: false,
      checkScroll() {
        const el = this.$refs.scrollList;
        if (!el) return;
        this.canScrollLeft = el.scrollLeft > 5;
        this.canScrollRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 5;
      },
      scroll(direction) {
        const el = this.$refs.scrollList;
        if (!el) return;
        const scrollAmount = 252;
        el.scrollBy({ 
          left: direction === 'left' ? -scrollAmount : scrollAmount, 
          behavior: 'smooth' 
        });
      }
    }"
    x-init="
      $nextTick(() => { checkScroll(); });
      window.addEventListener('resize', () => checkScroll());
      
      if (window.ResizeObserver) {
        const observer = new ResizeObserver(() => checkScroll());
        observer.observe($refs.scrollList);
      }
    "
  >
    <button
      type="button"
      class="carousel-nav-btn nav-left"
      x-show="canScrollLeft"
      @click="scroll('left')"
      x-transition
      x-cloak
    >
      ‹
    </button>
