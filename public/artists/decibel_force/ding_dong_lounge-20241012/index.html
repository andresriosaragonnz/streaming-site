<html lang="en">

  <body>
    <div class="studio-container" x-data="studioWorkspace">
  <section class="player-column">
  <div class="meta-workspace-card">
    <h2>ding dong lounge - 12 Oct 24</h2>
  </div>
  <div class="video-player-mock">
    <!-- Embedded responsive Vimeo player tracking the active store selection -->
    <template x-if="active.source">
      <iframe
        :src="`https://player.vimeo.com/video/${active.source}?autoplay=0&title=0&byline=0&portrait=0`"
        style="
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border: 0;
        "
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
      ></iframe>
    </template>

    <!-- Fallback state if no video source token identifier is provided -->
    <template x-if="!active.source">
      <div
        style="
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-size: cover;
          background-position: center;
        "
        :style="active.heroImage ? `background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), url(${active.heroImage})` : ''"
      >
        <div class="preview-badge">Preview Mock Window</div>
      </div>
    </template>
  </div>

  <div class="meta-workspace-card">
  <div class="header-row">
    <div class="studio-controls-group">
      <div class="input-field-group">
        <select
          x-model="active.title"
          @change="$store.review.syncStore($store.review.currentIndex, active.title)"
        >
          <option value="playlist 1">playlist 1</option>
          <option value="playlist 2">playlist 2</option>
        </select>
      </div>

      <button
        @click="$store.review.toggleStatus($store.review.currentIndex)"
        type="button"
        class="btn-public"
      >
        <span>Add to playlist</span>
      </button>
    </div>
  </div>
</div>

</section>
 <!-- src/templates/panels/ReviewSidebar.html -->
<aside class="playlist-sidebar">
  <div
    class="carousel-wrapper"
    x-data="{ 
      canScrollLeft: false, 
      canScrollRight: false,
      checkScroll() {
        const el = this.$refs.scrollList;
        if (!el) return;
        this.canScrollLeft = el.scrollLeft > 5;
        this.canScrollRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 5;
      },
      scroll(direction) {
        const el = this.$refs.scrollList;
        if (!el) return;
        const scrollAmount = 252;
        el.scrollBy({ 
          left: direction === 'left' ? -scrollAmount : scrollAmount, 
          behavior: 'smooth' 
        });
      }
    }"
    x-init="
      $nextTick(() => { checkScroll(); });
      window.addEventListener('resize', () => checkScroll());
      
      if (window.ResizeObserver) {
        const observer = new ResizeObserver(() => checkScroll());
        observer.observe($refs.scrollList);
      }
    "
  >
    <button
      type="button"
      class="carousel-nav-btn nav-left"
      x-show="canScrollLeft"
      @click="scroll('left')"
      x-transition
      x-cloak
    >
      ‹
    </button>

    <div
      class="sidebar-scroll-list"
      x-ref="scrollList"
      @scroll.debounce.50ms="checkScroll()"
    >
      <template
        x-for="(seg, idx) in $store.review.segments"
        :key="seg.id || idx"
      >
        <div @click="$store.review.currentIndex = idx" class="sidebar-item-card">
  <div
    class="item-thumbnail"
    :style="`background-image: url('/screenshots/card/${seg.performance}-card_${idx}.jpg')`"
  ></div>

  <div class="item-meta">
    <div class="title-text">
      <!-- FIXED: Linked to the dynamic, reactive title string -->
      <span x-text="seg.title"></span>
    </div>
    <div class="title-text">
      <span x-text="seg.duration"></span>
    </div>
  </div>
</div>
<div @click="$store.review.currentIndex = idx" class="sidebar-item-card">
  <div
    class="item-thumbnail"
    :style="`background-image: url('/screenshots/card/${seg.performance}-card_${idx}.jpg')`"
  ></div>

  <div class="item-meta">
    <div class="title-text">
      <!-- FIXED: Linked to the dynamic, reactive title string -->
      <span x-text="seg.title"></span>
    </div>
    <div class="title-text">
      <span x-text="seg.duration"></span>
    </div>
  </div>
</div>
<div @click="$store.review.currentIndex = idx" class="sidebar-item-card">

  ></div>

  <div class="item-meta">
    <div class="title-text">
      <!-- FIXED: Linked to the dynamic, reactive title string -->

    </div>
    <div class="title-text">
      <span x-text="seg.duration"></span>
    </div>
  </div>
</div>

      </template>
    </div>

    <button
      type="button"
      class="carousel-nav-btn nav-right"
      x-show="canScrollRight"
      @click="scroll('right')"
      x-transition
      x-cloak
    >
      ›
    </button>
  </div>
</aside>
