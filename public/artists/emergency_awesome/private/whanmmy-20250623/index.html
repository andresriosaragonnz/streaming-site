  <style>
    /* Baseline Wrapper (Invisible so it doesn't break main page layouts) */
    .menu {
      font-family:
        system-ui,
        -apple-system,
        sans-serif;
    }

    /* 
     * PURE CSS DRAWER MECHANICS 
     */

    /* 1. Hide the structural checkbox completely */
    #drawer-toggle {
      display: none;
    }

    /* 2. Style the trigger button (Hamburger Menu) - NOW FIXED/STICKY */
    .drawer-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #1f2937;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid #374151;
      transition: background-color 0.2s ease;
      user-select: none;

      /* Sticky/Fixed Positioning */

      z-index: 30; /* Keeps it above content, but below the dark overlay (40) */
    }
    .drawer-trigger:hover {
      background-color: #374151;
    }

    /* 3. The dark background overlay */
    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none; /* Ignore clicks when hidden */
      transition: opacity 0.3s ease;
      z-index: 40;
    }

    /* 4. The Drawer Panel itself */
    .drawer-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100vh;
      background-color: #111827;
      border-right: 1px solid #1f2937;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
      transform: translateX(-100%); /* Push completely off-screen */
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
      display: flex;
      flex-direction: column;
    }

    /* 5. Trigger the open states when the hidden checkbox is checked */
    #drawer-toggle:checked ~ .drawer-overlay {
      opacity: 1;
      pointer-events: auto;
    }
    #drawer-toggle:checked ~ .drawer-panel {
      transform: translateX(0);
    }

    /* 
     * DRAWER INTERIOR STYLING 
     */
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 20px;
      border-bottom: 1px solid #1f2937;
    }
    .drawer-header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
    }

    /* Close button inside the drawer */
    .drawer-close {
      color: #9ca3af;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .drawer-close:hover {
      color: #ffffff;
    }

    /* Link list styling */
    .drawer-links {
      list-style: none;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .drawer-link {
      display: block;
      padding: 12px 16px;
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .drawer-link:hover {
      background-color: #1f2937;
      color: #ffffff;
    }
  </style>

  <!-- 1. The Hidden State Controller -->
  <input type="checkbox" id="drawer-toggle" />

  <!-- 2. The Open Button -->
  <label for="drawer-toggle" class="drawer-trigger">
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
    Menu
  </label>

  <!-- 3. The Dark Overlay Backdrop (Clicking it closes the drawer) -->
  <label for="drawer-toggle" class="drawer-overlay"></label>

  <!-- 4. The Drawer Layout Block -->
  <aside class="drawer-panel">
    <div class="drawer-header">
      <h2>Studio Navigation</h2>
      <label for="drawer-toggle" class="drawer-close" aria-label="Close menu"
        >&times;</label
      >
    </div>

    <!-- JSON Compilation Target -->
    <ul id="drawer-target" class="drawer-links"></ul>
  </aside>

  <!-- 5. The Compilation Script -->
  <script>
    // JSON Routing Data
    const menuRoutes = [
      { title: "Artists view (example)", href: "/artists/decibel_force" },
      { title: "Roadmap", href: "/roadmap" },
      { title: "Budget", href: "/budget" },
    ];

    /**
     * Maps the JSON routing objects into pure HTML list items.
     */
    function compileMenu(items) {
      const targetContainer = document.getElementById("drawer-target");
      if (!targetContainer || !items.length) return;

      const compiledHtml = items
        .map(
          (item) => `
        <li>
          <a href="${item.href}" class="drawer-link">${item.title}</a>
        </li>
      `,
        )
        .join("\n");

      targetContainer.innerHTML = compiledHtml;
    }

    // Trigger target compilation immediately when document mounts
    document.addEventListener("DOMContentLoaded", () => {
      compileMenu(menuRoutes);
    });
  </script>

 <!-- src/templates/panels/ReviewSidebar.html -->
<aside class="playlist-sidebar">
  <div
    class="carousel-wrapper"
    x-data="{ 
      canScrollLeft: false, 
      canScrollRight: false,
      checkScroll() {
        const el = this.$refs.scrollList;
        if (!el) return;
        this.canScrollLeft = el.scrollLeft > 5;
        this.canScrollRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 5;
      },
      scroll(direction) {
        const el = this.$refs.scrollList;
        if (!el) return;
        const scrollAmount = 252;
        el.scrollBy({ 
          left: direction === 'left' ? -scrollAmount : scrollAmount, 
          behavior: 'smooth' 
        });
      }
    }"
    x-init="
      $nextTick(() => { checkScroll(); });
      window.addEventListener('resize', () => checkScroll());
      
      if (window.ResizeObserver) {
        const observer = new ResizeObserver(() => checkScroll());
        observer.observe($refs.scrollList);
      }
    "
  >
    <button
      type="button"
      class="carousel-nav-btn nav-left"
      x-show="canScrollLeft"
      @click="scroll('left')"
      x-transition
      x-cloak
    >
      ‹
    </button>

    <div
      class="sidebar-scroll-list"
      x-ref="scrollList"
      @scroll.debounce.50ms="checkScroll()"
    >
      <template
        x-for="(seg, idx) in $store.review.segments"
        :key="seg.id || idx"
      >
        <div
  @click="$store.review.currentIndex = idx"
  class="sidebar-item-card"
  :class="[
    $store.review.currentIndex === idx ? 'item-active-highlight' : '',
    seg.status === 'private' ? 'sidebar-item-card' : 'sidebar-item-card=private'
  ]"
>
  <!-- Responsive Picture replacing background-image -->
  <picture class="item-thumbnail">
    <!-- AVIF format (first priority) -->
    <source :srcset="`${seg.cardImage}.avif`" type="image/avif" />

    <!-- WebP format (second priority) -->
    <source :srcset="`${seg.cardImage}.webp`" type="image/webp" />

    <!-- Legacy JPEG Fallback -->
    <img
      :src="`${seg.cardImage}.jpg`"
      :alt="seg.title"
      loading="lazy"
      style="width: 100%; height: 100%; object-fit: cover; display: block"
    />
  </picture>

  <div class="item-meta">
    <div class="title-text">
      <!-- FIXED: Linked to the dynamic, reactive title string -->
      <span x-text="seg.title"></span>
    </div>
    <div class="title-text">
      <span x-text="seg.status === 'public' ? 'Public' : 'Private'"
        >Private</span
      >
    </div>
  </div>
</div>
<div
  @click="$store.review.currentIndex = idx"

  :class="[
    $store.review.currentIndex === idx ? 'item-active-highlight' : '',

  <div class="item-meta">

      <!-- FIXED: Linked to the dynamic, reactive title string -->

    </div>
    <div class="title-text">
      <span x-text="seg.status === 'public' ? 'Public' : 'Private'"
        >Private</span

    </div>
  </div>
</div>

      </template>
    </div>

    <button
