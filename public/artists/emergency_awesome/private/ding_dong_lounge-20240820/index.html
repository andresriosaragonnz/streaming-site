<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ding dong lounge - 20 Aug 24 | Live Archive</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="studio-container" x-data="studioWorkspace">
  <section class="player-column">
  <div class="meta-workspace-card">
    <h2>ding dong lounge - 20 Aug 24</h2>
  </div>
  <div
    class="video-player-mock"
    :style="'background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)), url(' + active.heroImage + ')'"
  >
    <div class="preview-badge">Preview Mock Window</div>
  </div>

  <div class="meta-workspace-card">
    <div class="header-row">
      <div class="studio-controls-group">
        <div class="input-field-group">
          <input
            type="text"
            x-model="active.title"
            @input="$store.review.syncStore($store.review.currentIndex, active.title)"
          />
        </div>

        <button
          @click="$store.review.toggleStatus($store.review.currentIndex)"
          type="button"
          :class="active.status === 'public' ? 'btn-public' : 'btn-private'"
        >
          <span
            x-text="active.status === 'public' ? 'Public' : 'Private'"
          ></span>
        </button>
      </div>
    </div>
  </div>
</section>
 <aside class="playlist-sidebar">
  <div
    class="carousel-wrapper"
    x-data="{ 
      canScrollLeft: false, 
      canScrollRight: false,
      checkScroll() {
        const el = this.$refs.scrollList;
        if (!el) return;
        this.canScrollLeft = el.scrollLeft > 5;
        this.canScrollRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 5;
      },
      scroll(direction) {
        const el = this.$refs.scrollList;
        if (!el) return;
        const scrollAmount = 252; // Mapped precisely to card flex width + gap
        el.scrollBy({ 
          left: direction === 'left' ? -scrollAmount : scrollAmount, 
          behavior: 'smooth' 
        });
      }
    }"
    x-init="
      $nextTick(() => { checkScroll(); });
      window.addEventListener('resize', () => checkScroll());
      
      /* Robust Observer pass handles layout timing shifts */
      if (window.ResizeObserver) {
        const observer = new ResizeObserver(() => checkScroll());
        observer.observe($refs.scrollList);
      }
    "
  >
    <button
      type="button"
      class="carousel-nav-btn nav-left"
      x-show="canScrollLeft"
      @click="scroll('left')"
      x-transition
      x-cloak
    >
      ‹
    </button>

    <div
      class="sidebar-scroll-list"
      x-ref="scrollList"
      @scroll.debounce.50ms="checkScroll()"
    >
      <template
        x-for="(seg, idx) in $store.review.segments"
        :key="seg.id || idx"
      >
        <div
          @click="$store.review.currentIndex = idx"
          class="sidebar-item-card"
          :class="[
            $store.review.currentIndex === idx ? 'item-active-highlight' : '',
            seg.status === 'private' ? 'item-private-dim' : ''
          ]"
        >
          <div
            class="item-thumbnail"
            :style="'background-image: url(' + seg.cardImage + ')'"
          ></div>

          <div class="item-meta">
            <div class="title-text">
              <span x-text="seg.title"></span>
            </div>
            <div class="status-row">
              <span
                x-text="seg.status === 'public' ? '🌐 Public' : '🔒 Private'"
              ></span>
              <span>•</span>
              <span x-text="'Track ' + (idx + 1)"></span>
            </div>
          </div>
        </div>
      </template>
    </div>

    <button
      type="button"
      class="carousel-nav-btn nav-right"
      x-show="canScrollRight"
      @click="scroll('right')"
      x-transition
      x-cloak
    >
      ›
    </button>
  </div>
</aside>

</div>

</script>

  </body>
</html>
