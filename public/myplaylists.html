<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Playlists</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="menu-container"><div class="menu">
  <!-- 1. The Hidden State Controller -->
  <input type="checkbox" id="drawer-toggle" />

  <!-- 2. The Open Button -->
  <label for="drawer-toggle" class="drawer-trigger">
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
    Menu
  </label>

  <!-- 3. The Dark Overlay Backdrop (Clicking it closes the drawer) -->
  <label for="drawer-toggle" class="drawer-overlay"></label>

  <!-- 4. The Drawer Layout Block -->
  <aside class="drawer-panel">
    <div class="drawer-header">
      <h2>Studio Navigation</h2>
      <label for="drawer-toggle" class="drawer-close" aria-label="Close menu"
        >&times;</label
      >
    </div>

    <!-- JSON Compilation Target -->
    <ul id="drawer-target" class="drawer-links"></ul>
  </aside>

  <!-- 5. The Compilation Script -->
  <script>
    // JSON Routing Data
    const menuRoutes = [
      { title: "My playlists", href: "/myplaylists" },
      { title: "Private", href: "/private/decibel_force" },
      { title: "Roadmap", href: "/roadmap" },
      { title: "Budget", href: "/budget" },
    ];

    /**
     * Maps the JSON routing objects into pure HTML list items.
     */
    function compileMenu(items) {
      const targetContainer = document.getElementById("drawer-target");
      if (!targetContainer || !items.length) return;

      const compiledHtml = items
        .map(
          (item) => `
        <li>
          <a href="${item.href}" class="drawer-link">${item.title}</a>
        </li>
      `,
        )
        .join("\n");

      targetContainer.innerHTML = compiledHtml;
    }

    // Trigger target compilation immediately when document mounts
    document.addEventListener("DOMContentLoaded", () => {
      compileMenu(menuRoutes);
    });
  </script>
</div>
</div>
    <div
  class="artist-hero"
  x-data="{ 
    // Generates a random number between 1 and n (e.g., 5 total hero images)
    heroImage: `/images/playlist_${Math.floor(Math.random() * 5) + 1}` 
  }"
>
  <!-- 1. Responsive Picture Stack -->
  <picture class="hero-picture">
    <!-- Mobile Portrait (4:5) (< 640px) -->
    <source
      type="image/avif"
      media="(max-width: 639px)"
      :srcset="`${heroImage}_mobile.avif`"
    />
    <source
      type="image/webp"
      media="(max-width: 639px)"
      :srcset="`${heroImage}_mobile.webp`"
    />

    <!-- Tablet (max-width: 1023px) -->
    <source
      type="image/avif"
      media="(max-width: 1023px)"
      :srcset="`${heroImage}_tablet.avif`"
    />
    <source
      type="image/webp"
      media="(max-width: 1023px)"
      :srcset="`${heroImage}_tablet.webp`"
    />

    <!-- Desktop Master (16:9) (>= 1024px) -->
    <source type="image/avif" :srcset="`${heroImage}_desktop.avif`" />
    <source type="image/webp" :srcset="`${heroImage}_desktop.webp`" />

    <!-- Legacy Fallback JPG -->
    <img
      :src="`${heroImage}_desktop.jpg`"
      alt="My playlists"
      class="hero-img"
      loading="eager"
    />
  </picture>

  <!-- 2. Independent Gradient Overlay for Readability -->
  <div class="hero-gradient-overlay"></div>

  <!-- 3. Foreground Content Overlay (Aligned to Bottom) -->
  <div class="hero-overlay">
    <h1 class="capitalize-words">My playlists</h1>
    <p class="performance-count">
      <span x-text="Object.keys($store.playlists.playlists || {}).length"
        >0</span
      >
      Playlists
    </p>
  </div>
</div>

    <main class="performance-grid" x-data>
      <template
        x-for="(list, name) in $store.playlists.getPlaylistsPortfolio()"
        :key="name"
      >
        <a
          :href="$store.playlists.getShareLink(name)"
          class="card"
          style="text-decoration: none; color: inherit"
        >
          <div class="card">
            <picture class="item-thumbnail">
              <source :srcset="`${list.image}.avif`" type="image/avif" />
              <source :srcset="`${list.image}.webp`" type="image/webp" />
              <img
                :src="`${list.image}.jpg`"
                loading="lazy"
                style="
                  width: 100%;
                  height: 100%;
                  object-fit: cover;
                  display: block;
                "
              />
            </picture>

            <div class="card-metadata">
              <h3 class="capitalize-words h3" x-text="name"></h3>
              <p class="amount" x-text="`${list.amount} Items`"></p>
            </div>
          </div>
        </a>
      </template>
    </main>
  </body>
  <script type="module" src="/js/publicApp.js"></script>
</html>
