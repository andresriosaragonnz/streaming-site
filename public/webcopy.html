<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artist Co-Performance Network</title>
    <!-- CSS Asset -->
    <link rel="stylesheet" href="/css/network.css" />
    <!-- Memgraph Orb CDN -->
    <script src="https://unpkg.com/@memgraph/orb@0.0.2/dist/browser/orb.js"></script>
  </head>
  <body>
    <div id="reset-btn-container">
      <button id="reset-btn" class="reset-btn">Show Full Network</button>
      <a
        id="see-videos-btn"
        class="reset-btn"
        href="#"
        onclick="
          const artist = new URLSearchParams(window.location.search).get(
            'artist',
          );
          if (artist) {
            this.href = '/' + encodeURIComponent(artist);
          } else {
            return false;
          }
        "
      >
        See videos
      </a>
    </div>
    <div id="graph"></div>

    <!-- JS Application Module -->
    <script type="module" src="/js/network.js"></script>
  </body>
</html>
