<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Playlist | Live Archive</title>
    <link rel="stylesheet" href="/css/review-studio.css" />
  </head>
  <body>
    <div class="studio-container" x-data="sharedPlaylistWorkspace">
      <!-- LEFT COLUMN: VIDEO PLAYER & METADATA DECK -->
      <section class="player-column">
        <div class="meta-workspace-card">
          <h2
            x-text="active.title ? `Shared: ${active.title}` : 'Shared Playlist'"
          >
            Shared Playlist
          </h2>
        </div>

        <div class="video-player-mock">
          <div
            x-show="active.source"
            style="width: 100%; height: 100%; background: #000"
          >
            <video
              id="r2-stream-player"
              controls
              playsinline
              preload="metadata"
              :poster="active.heroImage"
              style="
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
              "
            ></video>
          </div>

          <!-- Empty Fallback Workspace State -->
          <template x-if="!active.source">
            <div
              style="
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background-color: #111;
              "
            >
              <div
                class="preview-badge"
                x-text="loading ? 'Loading playlist...' : 'No Stream Active'"
              >
                No Stream Active
              </div>
            </div>
          </template>
        </div>

        <!-- Bottom Action Panel -->
        <div class="meta-workspace-card">
          <div class="header-row">
            <div class="studio-controls-group">
              <span
                style="color: #888; font-size: 0.9rem"
                x-text="`${segments.length} tracks loaded via share link`"
              ></span>
            </div>
          </div>
        </div>
      </section>

      <!-- RIGHT SIDEBAR: DYNAMIC FEED OF FILTERED TRACKS -->
      <aside class="playlist-sidebar">
        <div
          class="carousel-wrapper"
          x-data="{ 
            canScrollLeft: false, 
            canScrollRight: false,
            checkScroll() {
              const el = this.$refs.scrollList;
              if (!el) return;
              this.canScrollLeft = el.scrollLeft > 5;
              this.canScrollRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 5;
            },
            scroll(direction) {
              const el = this.$refs.scrollList;
              if (!el) return;
              const scrollAmount = 252;
              el.scrollBy({ 
                left: direction === 'left' ? -scrollAmount : scrollAmount, 
                behavior: 'smooth' 
              });
            }
          }"
          x-init="
            $nextTick(() => { checkScroll(); });
            window.addEventListener('resize', () => checkScroll());
            if (window.ResizeObserver) {
              const observer = new ResizeObserver(() => checkScroll());
              observer.observe($refs.scrollList);
            }
          "
        >
          <button
            type="button"
            class="carousel-nav-btn nav-left"
            x-show="canScrollLeft"
            @click="scroll('left')"
            x-transition
            x-cloak
          >
            ‹
          </button>

          <div
            class="sidebar-scroll-list"
            x-ref="scrollList"
            @scroll.debounce.50ms="checkScroll()"
          >
            <template x-for="(seg, idx) in segments" :key="seg.id || idx">
              <div
                @click="currentIndex = idx"
                class="sidebar-item-card"
                :class="{ 'active-card': currentIndex === idx }"
                style="cursor: pointer"
              >
                <div
                  class="item-thumbnail"
                  :style="`background-image: url('/screenshots/card/${seg.performance}-card_${seg.index}.jpg')`"
                ></div>

                <div class="item-meta">
                  <div class="title-text">
                    <span x-text="seg.title"></span>
                  </div>
                  <div class="title-text">
                    <span x-text="`${seg.duration}s`"></span>
                  </div>
                </div>
              </div>
            </template>
          </div>

          <button
            type="button"
            class="carousel-nav-btn nav-right"
            x-show="canScrollRight"
            @click="scroll('right')"
            x-transition
            x-cloak
          >
            ›
          </button>
        </div>
      </aside>
    </div>

    <!-- UI Logic & Hardcoded Demo Datastore -->
    <script>
      // Hardcoded master array matching the demo data structure
      const MASTER_SEGMENTS = [
        {
          id: "x7K9pW2mQ",
          title: "segment_0",
          index: "0",
          startTime: 0,
          duration: 360,
          hash: "sha256-8f43c08b2bc96173d1222f2812d4d97f268b8a0a1a0f8821017b203c90aefd6f",
          performance: "decibel_force-ding_dong_lounge-20241012",
          source:
            "https://pub-fef6bcaae286450e98785a845f724ff1.r2.dev/Decibel%20Force%20-%20Eclipse%20-Live%20ant%20Ding%20dong%2012%20oct%202024/output.m3u8",
          status: "public",
        },
        {
          id: "bN4vL9zTx",
          title: "segment_1",
          index: "1",
          startTime: 360,
          duration: 360,
          hash: "sha256-2db5c98a5fc8b56f26487e83ac5bde92c10b2bcfc4d4f647bc5d290fa8cb3fe1",
          performance: "decibel_force-ding_dong_lounge-20241012",
          source:
            "https://pub-fef6bcaae286450e98785a845f724ff1.r2.dev/Decibel%20Force%20-%20Edge%20of%20the%20World%20%20-Live%20ant%20Ding%20dong%2012%20oct%202024/output.m3u8",
          status: "public",
        },
        {
          id: "Kj8mR3wPy",
          title: "segment_2",
          index: "2",
          startTime: 720,
          duration: 360,
          hash: "sha256-fd304e8d2bb56fa2b88fce71cf7d853b0dfae63b8d4f45a75cfdd17fa4bb529e",
          performance: "decibel_force-ding_dong_lounge-20241012",
          source:
            "https://pub-fef6bcaae286450e98785a845f724ff1.r2.dev/Decibel%20Force%20-%20Endles%20Thread%20%20%20-Live%20at%20Ding%20dong%2012%20oct%202024/output.m3u8",
          status: "public",
        },
      ];

      document.addEventListener("alpine:init", () => {
        Alpine.data("sharedPlaylistWorkspace", () => ({
          segments: [],
          currentIndex: 0,
          loading: true,

          init() {
            this.$watch("currentIndex", () => {
              this.$nextTick(() => this.setupPlaybackStream());
            });

            // 1. Get query string params from the address bar
            const urlParams = new URLSearchParams(window.location.search);
            const sharedData = urlParams.get("share");

            if (!sharedData) {
              this.loading = false;
              return;
            }

            try {
              // 2. Decode the safe Base64 token into raw short IDs
              let base64 = sharedData.replace(/-/g, "+").replace(/_/g, "/");
              while (base64.length % 4) base64 += "=";
              const decodedIds = atob(base64).split(",");

              // 3. Client-side filter: Map URL IDs back to the hardcoded database
              this.segments = decodedIds
                .map((id) => MASTER_SEGMENTS.find((item) => item.id === id))
                .filter((item) => item !== undefined);

              this.loading = false;

              // 4. Fire up the first video in the shared selection list
              if (this.segments.length > 0) {
                this.currentIndex = 0;
                this.$nextTick(() => this.setupPlaybackStream());
              }
            } catch (e) {
              console.error("❌ Link parsing error:", e);
              this.loading = false;
            }
          },

          get active() {
            return (
              this.segments[this.currentIndex] || {
                id: "",
                title: "",
                source: "",
              }
            );
          },

          setupPlaybackStream() {
            const videoEl = document.getElementById("r2-stream-player");
            if (!videoEl || !this.active.source) return;

            if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
              videoEl.src = this.active.source;
            } else if (window.Hls && Hls.isSupported()) {
              if (this.hlsInstance) this.hlsInstance.destroy();
              this.hlsInstance = new Hls();
              this.hlsInstance.loadSource(this.active.source);
              this.hlsInstance.attachMedia(videoEl);
            } else {
              videoEl.src = this.active.source;
            }
          },
        }));
      });
    </script>
    <script src="/js/alpine.js" defer></script>
  </body>
</html>
