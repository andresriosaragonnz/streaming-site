<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>playlist | Live Archive</title>
    <link rel="stylesheet" href="/css/review-studio.css" />
  </head>
  <body>
    <div class="studio-container" x-data="studioWorkspace">
  <section class="player-column">
  <div class="meta-workspace-card">
    <a
      :href="active.pageTitleLink"
      style="text-decoration: none; color: inherit"
    >
      <h2 x-text="active.pageTitle"></h2>
    </a>
    <div class="toggle" @click="$store.review.togleMode()">
      <input type="checkbox" />
      <label></label>
    </div>
  </div>

  <div
    :class="$store.review.mode ? 'video-player-mock' : 'audio-player-mock'"
    style="position: relative; overflow: hidden; border-radius: 12px"
  >
    <!-- VIDEO PLAYER MODE (Visible when mode is true) -->
    <div
      x-show="$store.review.mode && active.source"
      style="width: 100%; height: 100%; background: #000"
    >
      <video
        id="r2-stream-player"
        controls
        playsinline
        preload="metadata"
        style="width: 100%; height: 100%; object-fit: contain; display: block"
      ></video>
    </div>

    <!-- MP3 AUDIO PLAYER MODE (Visible when mode is false) -->
    <div
      x-show="!$store.review.mode && active.source"
      style="
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        background-color: #1a1a1a;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      "
      :style="active.playerImage ? `background-image: url(${active.playerImage})` : `background-image: url('/screenshots/card/card-fallback.jpg')`"
    >
      <!-- Audio Player Controls Pinned to the Bottom -->
      <div
        style="
          width: 100%;
          padding: 16px;
          background: rgba(0, 0, 0, 0.6);
          display: flex;
          justify-content: center;
          align-items: center;
          box-sizing: border-box;
        "
      >
        <audio
          id="r2-audio-player"
          controls
          preload="metadata"
          style="width: 100%; max-width: 500px"
        ></audio>
      </div>
    </div>

    <!-- Empty Fallback Workspace State -->
    <template x-if="!active.source">
      <div
        style="
          width: 100%;
          height: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #111;
        "
      >
        <div class="preview-badge">No Stream Active</div>
      </div>
    </template>
  </div>

  <div
  class="meta-workspace-card"
  x-data="{ 
    selectedPlaylist: Object.keys($store.playlists.playlists)[0] || 'favorites' 
  }"
>
  <div class="header-row">
    <div class="studio-controls-group">
      <div class="input-field-group">
        <!-- 1. Bind to local component state variable instead of active.title -->
        <select x-model="selectedPlaylist">
          <!-- 2. Loop through your state dynamically, or keep them hardcoded -->
          <template
            x-for="(list, name) in $store.playlists.playlists"
            :key="name"
          >
            <option :value="name" x-text="name"></option>
          </template>
        </select>
      </div>

      <!-- 3. Pass the selected playlist target parameter straight to the method -->
      <button
        @click="$store.playlists.addActiveToPlaylist(selectedPlaylist)"
        type="button"
        class="btn-public"
      >
        <span>Add to playlist</span>
      </button>
      <button
        @click="$store.playlists.generateShareLink(selectedPlaylist)"
        type="button"
        class="btn-public"
      >
        <span>Share playlist</span>
      </button>
    </div>
  </div>
</div>

</section>
 <!-- src/templates/panels/ReviewSidebar.html -->
<aside class="playlist-sidebar">
  <div
    class="carousel-wrapper"
    x-data="{ 
      canScrollLeft: false, 
      canScrollRight: false,
      checkScroll() {
        const el = this.$refs.scrollList;
        if (!el) return;
        this.canScrollLeft = el.scrollLeft > 5;
        this.canScrollRight = el.scrollLeft + el.clientWidth < el.scrollWidth - 5;
      },
      scroll(direction) {
        const el = this.$refs.scrollList;
        if (!el) return;
        const scrollAmount = 252;
        el.scrollBy({ 
          left: direction === 'left' ? -scrollAmount : scrollAmount, 
          behavior: 'smooth' 
        });
      }
    }"
    x-init="
      $nextTick(() => { checkScroll(); });
      window.addEventListener('resize', () => checkScroll());
      
      if (window.ResizeObserver) {
        const observer = new ResizeObserver(() => checkScroll());
        observer.observe($refs.scrollList);
      }
    "
  >
    <button
      type="button"
      class="carousel-nav-btn nav-left"
      x-show="canScrollLeft"
      @click="scroll('left')"
      x-transition
      x-cloak
    >
      ‹
    </button>

    <div
      class="sidebar-scroll-list"
      x-ref="scrollList"
      @scroll.debounce.50ms="checkScroll()"
    >
      <template
        x-for="(seg, idx) in $store.review.segments"
        :key="seg.id || idx"
      >
        <div @click="$store.review.currentIndex = idx" class="sidebar-item-card">
  <div
    class="item-thumbnail"
    :style="`background-image: url('/screenshots/card/${seg.id}.jpg')`"
  ></div>

  <div class="item-meta">
    <div class="title-text">
      <!-- FIXED: Linked to the dynamic, reactive title string -->
      <span x-text="seg.title"></span>
    </div>
    <div class="title-text">
      <span x-text="seg.duration"></span>
    </div>
  </div>
</div>
<div @click="$store.review.currentIndex = idx" class="sidebar-item-card">
  <div
    class="item-thumbnail"
    :style="`background-image: url('/screenshots/card/${seg.id}.jpg')`"
  ></div>

  <div class="item-meta">
    <div class="title-text">
      <!-- FIXED: Linked to the dynamic, reactive title string -->
      <span x-text="seg.title"></span>
    </div>
    <div class="title-text">
      <span x-text="seg.duration"></span>
    </div>
  </div>
</div>
<div @click="$store.review.currentIndex = idx" class="sidebar-item-card">
  <div
    class="item-thumbnail"
    :style="`background-image: url('/screenshots/card/${seg.id}.jpg')`"
  ></div>

  <div class="item-meta">
    <div class="title-text">
      <!-- FIXED: Linked to the dynamic, reactive title string -->
      <span x-text="seg.title"></span>
    </div>
    <div class="title-text">
      <span x-text="seg.duration"></span>
    </div>
  </div>
</div>

      </template>
    </div>

    <button
      type="button"
      class="carousel-nav-btn nav-right"
      x-show="canScrollRight"
      @click="scroll('right')"
      x-transition
      x-cloak
    >
      ›
    </button>
  </div>
</aside>

</div>
