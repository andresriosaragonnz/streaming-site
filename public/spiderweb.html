<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenStream | Rock Galaxy</title>
    <!-- Stable Orb CDN -->
    <script src="https://unpkg.com/@memgraph/orb@0.0.2/dist/browser/orb.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #040714; /* Deep Disney+ Blue */
        overflow: hidden;
        color: white;
        font-family: sans-serif;
      }
      #graph {
        width: 100vw;
        height: 100vh;
      }
      .label {
        position: absolute;
        top: 20px;
        left: 20px;
        font-weight: bold;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="label">EXPLORE CLASSIC ROCK</div>
    <div id="graph"></div>

    <script>
      const container = document.getElementById("graph");

      // 1. Data Generation (50 Bands)
      const bandNames = [
        "Led Zeppelin",
        "Pink Floyd",
        "The Beatles",
        "The Rolling Stones",
        "Queen",
        "The Who",
        "AC/DC",
        "Jimi Hendrix",
        "The Doors",
        "Nirvana",
        "Black Sabbath",
        "Deep Purple",
        "Guns N' Roses",
        "Fleetwood Mac",
        "David Bowie",
        "Eagles",
        "Aerosmith",
        "Van Halen",
        "Rush",
        "Genesis",
        "Yes",
        "King Crimson",
        "The Clash",
        "The Ramones",
        "ZZ Top",
        "Lynyrd Skynyrd",
        "CCR",
        "Metallica",
        "Iron Maiden",
        "Dire Straits",
        "The Police",
        "Talking Heads",
        "U2",
        "Journey",
        "Boston",
        "Foreigner",
        "Steely Dan",
        "The Byrds",
        "Jefferson Airplane",
        "Janis Joplin",
        "Cream",
        "Allman Brothers",
        "Santana",
        "Tom Petty",
        "Springsteen",
        "The Kinks",
        "Thin Lizzy",
        "Alice Cooper",
        "Motörhead",
        "Def Leppard",
      ];

      const nodes = bandNames.map((name, index) => ({
        id: index + 1,
        name: name,
      }));

      // 2. Edge Creation with Compatibility Fix
      const edges = [];
      for (let i = 0; i < nodes.length; i++) {
        // Connect to next node
        if (i < nodes.length - 1) {
          edges.push({
            id: `e1-${i}`,
            // We provide BOTH to ensure the library sees the connection
            start: nodes[i].id,
            end: nodes[i + 1].id,
            source: nodes[i].id,
            target: nodes[i + 1].id,
          });
        }
        // Connect to node + 5 for "Web" effect
        if (i + 5 < nodes.length) {
          edges.push({
            id: `e2-${i}`,
            start: nodes[i].id,
            end: nodes[i + 5].id,
            source: nodes[i].id,
            target: nodes[i + 5].id,
          });
        }
      }

      // 3. Initialize Orb
      const orb = new Orb.Orb(container);

      // 4. Force Visible Styles
      orb.data.setDefaultStyle({
        getNodeStyle(node) {
          return {
            size: 6,
            color: "#0072d2", // Signature Blue
            label: node.data.name,
            fontSize: 4,
            fontColor: "#ffffff",
          };
        },
        getEdgeStyle() {
          return {
            color: "#ffffff", // Bright White
            width: 0.5,
            opacity: 0.4,
          };
        },
      });

      // 5. Setup & Physics
      orb.data.setup({ nodes, edges });

      orb.view.setSettings({
        simulation: {
          isPhysicsEnabled: true,
          gravity: -1000,
          springLength: 80,
        },
      });

      // 6. Final Render
      orb.view.render(() => {
        orb.view.recenter();
      });

      // Event listener to help you debug in console
      orb.events.on("node-click", (event) => {
        console.log("Clicked:", event.node.data.name);
      });
    </script>
  </body>
</html>
