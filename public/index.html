<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Artists | Live Archive</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div
      class="artist-hero"
      style="
        background-image:
          linear-gradient(rgba(4, 7, 20, 0.2), rgba(4, 7, 20, 1)),
          url(&quot;/index.jpg&quot;);
      "
    >
      <div class="hero-overlay">
        <a href="/" class="btn-back">← Back to Archive</a>
        <h1 class="capitalize-words">live archive</h1>
        <p class="performance-count">2 Documented</p>
      </div>
    </div>

    <main class="performance-grid">
      <a
        href="/artists/decibel_force"
        class="card artist-card"
        style="text-decoration: none; color: inherit; display: block"
      >
        <div
          class="card-thumbnail"
          style="
            background-image: url(&quot;/screenshots/hero/decibel_force-ding_dong_lounge-20241012_hero_7.jpg&quot;);
          "
        ></div>
        <div class="card-metadata">
          <h3 class="capitalize-words">decibel force</h3>
          <p class="date" style="margin-bottom: 0">1 Performance</p>
        </div>
      </a>
      <a
        href="/artists/emergency_awesome"
        class="card artist-card"
        style="text-decoration: none; color: inherit; display: block"
      >
        <div
          class="card-thumbnail"
          style="
            background-image: url(&quot;/screenshots/hero/emergency_awesome-big_fan-20259623.jpg&quot;);
          "
        ></div>
        <div class="card-metadata">
          <h3 class="capitalize-words">emergency awesome</h3>
          <p class="date" style="margin-bottom: 0">1 Performance</p>
        </div>
      </a>
    </main>

    <script src="/js/prefetch.js" defer></script>
  </body>
</html>
