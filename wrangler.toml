# Top-Level / Default (Production)
name = "streaming-site" # 👈 Fixed to match Dashboard project name
main = "src/index.ts"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Production Routes (Clean hostnames without /*)
routes = [
  { pattern = "iknowthatband.org", custom_domain = true },     # 👈 Removed /*
  { pattern = "www.iknowthatband.org", custom_domain = true }  # 👈 Removed /*
]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true


[assets]
directory = "./public"
binding = "ASSETS"

# Production D1 Database
[[d1_databases]]
binding = "DB"
database_name = "db"
database_id = "c04dda39-26b4-4948-8dfc-ac33aa283ff4"

# Production KV Namespace
[[kv_namespaces]]
binding = "PAGE_CACHE"
id = "62705a56a0f745e985b2d712e8653903"

[[r2_buckets]]
binding = "STATIC_BUCKET"
bucket_name = "pages"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "testsync"


# -----------------------------------------------------------------------------
# Staging Environment Overrides
# -----------------------------------------------------------------------------
[env.staging]
name = "streaming-site-staging" # 👈 Matching naming convention
workers_dev = false

# Staging Route (Clean hostname without /*)
routes = [
  { pattern = "test.iknowthatband.org", custom_domain = true } # 👈 Removed /*
]

# Staging D1 Database
[[env.staging.d1_databases]]
binding = "DB"
database_name = "test"
database_id = "20d92b02-8f65-4e87-83d4-2fb8b57d5a1f"

# Staging KV Namespace
[[env.staging.kv_namespaces]]
binding = "PAGE_CACHE"
id = "62705a56a0f745e985b2d712e8653903"

[[env.staging.r2_buckets]]
binding = "STATIC_BUCKET"
bucket_name = "pages"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "testsync2"